<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="studioBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1b33"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>
  </defs>
  <!-- Architectural Studio Squircle -->
  <rect x="2" y="2" width="76" height="76" rx="16" fill="url(#studioBg)" stroke="url(#studioBorder)" stroke-width="2"/>
  <!-- Silver corner accents -->
  <circle cx="12" cy="12" r="1.5" fill="#94a3b8" opacity="0.6"/>
  <circle cx="68" cy="12" r="1.5" fill="#94a3b8" opacity="0.6"/>
  <circle cx="12" cy="68" r="1.5" fill="#94a3b8" opacity="0.6"/>
  <circle cx="68" cy="68" r="1.5" fill="#94a3b8" opacity="0.6"/>
  <!-- ST Monogram -->
  <text x="40" y="49" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="700" fill="#00e5ff" text-anchor="middle" letter-spacing="-0.04em">ST</text>
</svg>