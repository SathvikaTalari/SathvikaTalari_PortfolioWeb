<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1324" />
      <stop offset="50%" stop-color="#0f1f3d" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="heatRisk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background with Grid -->
  <rect width="800" height="480" fill="url(#bgGrad)" />
  <rect width="800" height="480" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="140" r="180" fill="rgba(56, 189, 248, 0.12)" filter="blur(60px)" />
  <circle cx="650" cy="340" r="160" fill="rgba(244, 63, 94, 0.12)" filter="blur(70px)" />

  <!-- App Window Container -->
  <g transform="translate(60, 40)">
    <!-- Header Bar -->
    <rect width="680" height="400" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
    <rect width="680" height="44" rx="16" fill="rgba(30, 41, 59, 0.7)" />
    <!-- Window Controls -->
    <circle cx="24" cy="22" r="6" fill="#ef4444" />
    <circle cx="44" cy="22" r="6" fill="#f59e0b" />
    <circle cx="64" cy="22" r="6" fill="#10b981" />
    <text x="340" y="27" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.08em">LADRIS · LAND ACQUISITION DELAY RISK INTELLIGENCE</text>

    <!-- GIS Map Viewport (Left) -->
    <g transform="translate(24, 64)">
      <rect width="360" height="310" rx="10" fill="#0b1322" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <!-- Topo / Contour GIS Lines -->
      <path d="M 20 80 Q 90 40 180 90 T 340 70" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
      <path d="M 20 150 Q 120 110 220 160 T 340 140" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />
      <path d="M 20 220 Q 140 180 240 230 T 340 200" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />

      <!-- Infrastructure Route Corridor -->
      <path d="M 40 260 L 120 200 L 220 130 L 320 80" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" />

      <!-- Risk Hotspot Circles -->
      <circle cx="220" cy="130" r="32" fill="rgba(244, 63, 94, 0.25)" stroke="#f43f5e" stroke-width="2" />
      <circle cx="220" cy="130" r="10" fill="#f43f5e" />
      <text x="220" y="105" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#f43f5e" text-anchor="middle">PARCEL #482: HIGH DELAY RISK (87%)</text>

      <circle cx="120" cy="200" r="22" fill="rgba(251, 146, 60, 0.2)" stroke="#fb923c" stroke-width="1.5" />
      <circle cx="120" cy="200" r="7" fill="#fb923c" />
      <text x="120" y="185" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#fb923c" text-anchor="middle">MED RISK (54%)</text>

      <!-- GIS Legend Tag -->
      <rect x="14" y="270" width="130" height="26" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.3)" />
      <text x="24" y="287" font-family="'Space Grotesk', system-ui" font-size="10" font-weight="600" fill="#38bdf8">🌐 GIS LAYER ACTIVE</text>
    </g>

    <!-- Analytics & Explainable AI Panel (Right) -->
    <g transform="translate(404, 64)">
      <!-- Risk Score Card -->
      <rect width="252" height="95" rx="10" fill="rgba(21, 30, 50, 0.85)" stroke="rgba(255,255,255,0.08)" />
      <text x="16" y="24" font-family="'Space Grotesk', system-ui" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.05em">LIGHTGBM PREDICTIVE ENGINE</text>
      <text x="16" y="58" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="800" fill="#f43f5e">87.4%</text>
      <text x="116" y="48" font-family="'Space Grotesk', system-ui" font-size="11" font-weight="600" fill="#f8fafc">Delay Probability</text>
      <text x="116" y="66" font-family="'Space Grotesk', system-ui" font-size="10" fill="#94a3b8">+4.2 mos projected delay</text>

      <!-- Feature Importance Bar Chart (Explainable AI) -->
      <rect y="110" width="252" height="195" rx="10" fill="rgba(21, 30, 50, 0.85)" stroke="rgba(255,255,255,0.08)" />
      <text x="16" y="132" font-family="'Space Grotesk', system-ui" font-size="11" font-weight="700" fill="#38bdf8">SHAP Explainable Factors</text>

      <!-- Bar 1: Title Disputes -->
      <text x="16" y="156" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">Cadastral / Title Disputes</text>
      <rect x="16" y="162" width="220" height="8" rx="4" fill="rgba(255,255,255,0.06)" />
      <rect x="16" y="162" width="185" height="8" rx="4" fill="url(#heatRisk)" />

      <!-- Bar 2: Environmental Clearance -->
      <text x="16" y="190" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">Forest / Eco Clearance</text>
      <rect x="16" y="196" width="220" height="8" rx="4" fill="rgba(255,255,255,0.06)" />
      <rect x="16" y="196" width="138" height="8" rx="4" fill="#38bdf8" />

      <!-- Bar 3: Compensation Settlement -->
      <text x="16" y="224" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">Compensation Disputes</text>
      <rect x="16" y="230" width="220" height="8" rx="4" fill="rgba(255,255,255,0.06)" />
      <rect x="16" y="230" width="98" height="8" rx="4" fill="#818cf8" />

      <!-- What-if pill -->
      <rect x="16" y="258" width="220" height="32" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
      <text x="126" y="278" font-family="'Space Grotesk', system-ui" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">⚡ What-If Simulation: Fast-Track Dispute</text>
    </g>
  </g>
</svg>
