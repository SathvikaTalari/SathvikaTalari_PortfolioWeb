<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd5b5" />
      <stop offset="100%" stop-color="#f5ba90" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261c14" />
      <stop offset="100%" stop-color="#0f0a06" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Base with Cosmic Gradient -->
  <circle cx="60" cy="60" r="58" fill="url(#avatarGlow)" />
  <circle cx="60" cy="60" r="55" fill="#0f172a" />
  <circle cx="60" cy="60" r="54" fill="url(#avatarGlow)" opacity="0.3" />

  <!-- Avatar Graphics (Clipped to Circle) -->
  <g clip-path="url(#circleClip)">
    <clipPath id="circleClip">
      <circle cx="60" cy="60" r="54" />
    </clipPath>

    <!-- Star / Tech particles in background -->
    <circle cx="28" cy="26" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="92" cy="34" r="1.2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="34" cy="80" r="1" fill="#a855f7" opacity="0.6"/>
    <circle cx="86" cy="74" r="1.5" fill="#ffffff" opacity="0.5"/>

    <!-- Hair (Back) -->
    <path d="M 32 46 C 24 60, 24 85, 28 105 L 92 105 C 96 85, 96 60, 88 46 C 82 32, 38 32, 32 46 Z" fill="url(#hairGrad)" />

    <!-- Shoulders & Tech Hoodie -->
    <path d="M 18 120 C 22 96, 40 84, 60 84 C 80 84, 98 96, 102 120 Z" fill="url(#jacketGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <!-- Hoodie V-neck & Inner Shirt -->
    <path d="M 48 88 L 60 104 L 72 88 Z" fill="#0284c7" opacity="0.4" />
    <path d="M 50 90 L 60 102 L 70 90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M 50 68 L 50 86 C 50 91, 70 91, 70 86 L 70 68 Z" fill="url(#skinGrad)" />
    <!-- Neck shadow -->
    <path d="M 50 72 C 57 76, 63 76, 70 72 L 70 77 C 63 80, 57 80, 50 77 Z" fill="#e09e75" opacity="0.5" />

    <!-- Head / Face -->
    <path d="M 38 46 C 36 62, 42 74, 60 74 C 78 74, 84 62, 82 46 C 80 32, 40 32, 38 46 Z" fill="url(#skinGrad)" />

    <!-- Ears -->
    <ellipse cx="37" cy="52" rx="3.5" ry="5.5" fill="#f5ba90" />
    <ellipse cx="83" cy="52" rx="3.5" ry="5.5" fill="#f5ba90" />
    <circle cx="37" cy="54" r="1.5" fill="#38bdf8" />
    <circle cx="83" cy="54" r="1.5" fill="#38bdf8" />

    <!-- Eyes (Warm, intelligent, smiling) -->
    <g>
      <!-- Left Eye -->
      <path d="M 44 48 Q 49 45 54 48" fill="none" stroke="#1c140e" stroke-width="2" stroke-linecap="round" />
      <ellipse cx="49" cy="51" rx="3" ry="3.5" fill="#261c14" />
      <circle cx="48" cy="50" r="1.2" fill="#ffffff" />
      <circle cx="50" cy="52" r="0.6" fill="#ffffff" />
      <!-- Left Eyebrow -->
      <path d="M 43 44 Q 48 41 53 43" fill="none" stroke="#261c14" stroke-width="1.8" stroke-linecap="round" />

      <!-- Right Eye -->
      <path d="M 66 48 Q 71 45 76 48" fill="none" stroke="#1c140e" stroke-width="2" stroke-linecap="round" />
      <ellipse cx="71" cy="51" rx="3" ry="3.5" fill="#261c14" />
      <circle cx="70" cy="50" r="1.2" fill="#ffffff" />
      <circle cx="72" cy="52" r="0.6" fill="#ffffff" />
      <!-- Right Eyebrow -->
      <path d="M 67 43 Q 72 41 77 44" fill="none" stroke="#261c14" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Cute Nose -->
    <path d="M 59 52 Q 60 56 62 56" fill="none" stroke="#d48a60" stroke-width="1.4" stroke-linecap="round" />

    <!-- Gentle Friendly Smile -->
    <path d="M 52 62 Q 60 68 68 62" fill="none" stroke="#b95d43" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 54 62 Q 60 65 66 62" fill="#ffffff" opacity="0.8" />

    <!-- Rosy Cheeks -->
    <ellipse cx="44" cy="56" rx="3.5" ry="2" fill="#f43f5e" opacity="0.25" />
    <ellipse cx="76" cy="56" rx="3.5" ry="2" fill="#f43f5e" opacity="0.25" />

    <!-- Hair (Front bangs & stylish flow) -->
    <path d="M 36 42 C 40 28, 76 26, 84 40 C 76 34, 62 34, 52 38 C 44 42, 38 48, 36 54 C 37 48, 36 44, 36 42 Z" fill="url(#hairGrad)" />
    <!-- Side hair strands -->
    <path d="M 36 44 C 33 54, 34 68, 36 74 C 38 68, 39 58, 40 48 Z" fill="url(#hairGrad)" />
    <path d="M 84 42 C 86 54, 85 68, 83 74 C 82 68, 81 58, 80 48 Z" fill="url(#hairGrad)" />

    <!-- Modern Studio Headphones around neck -->
    <g>
      <!-- Headphone Band -->
      <path d="M 32 76 C 36 94, 84 94, 88 76" fill="none" stroke="#0ea5e9" stroke-width="5.5" stroke-linecap="round" />
      <path d="M 32 76 C 36 94, 84 94, 88 76" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <!-- Left Ear Cup -->
      <rect x="26" y="68" width="9" height="15" rx="4.5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-15 30 75)" />
      <!-- Right Ear Cup -->
      <rect x="85" y="68" width="9" height="15" rx="4.5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" transform="rotate(15 90 75)" />
    </g>
  </g>
</svg>

