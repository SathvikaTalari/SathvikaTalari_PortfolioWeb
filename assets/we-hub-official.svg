<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="16" fill="#ffffff"/>
  
  <!-- WE (Top row circles in golden yellow/amber) -->
  <g transform="translate(18, 14)">
    <!-- 'W' Circle -->
    <circle cx="20" cy="20" r="18" fill="#f59e0b"/>
    <text x="20" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">W</text>
    
    <!-- 'E' Circle with sunburst rays -->
    <circle cx="64" cy="20" r="18" fill="#f59e0b"/>
    <!-- Decorative mini rays around E -->
    <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9">
      <line x1="64" y1="4" x2="64" y2="7"/>
      <line x1="64" y1="33" x2="64" y2="36"/>
      <line x1="48" y1="20" x2="51" y2="20"/>
      <line x1="77" y1="20" x2="80" y2="20"/>
      <line x1="53" y1="9" x2="55" y2="11"/>
      <line x1="73" y1="29" x2="75" y2="31"/>
      <line x1="53" y1="31" x2="55" y2="29"/>
      <line x1="73" y1="11" x2="75" y2="9"/>
    </g>
    <text x="64" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">E</text>
  </g>

  <!-- HUB (Bottom row circles in vibrant orange) -->
  <g transform="translate(6, 56)">
    <!-- 'H' Circle -->
    <circle cx="20" cy="20" r="17" fill="#ea580c"/>
    <text x="20" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle">H</text>

    <!-- 'U' Circle -->
    <circle cx="54" cy="20" r="17" fill="#ea580c"/>
    <text x="54" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle">U</text>

    <!-- 'B' Circle -->
    <circle cx="88" cy="20" r="17" fill="#ea580c"/>
    <text x="88" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle">B</text>
  </g>

  <!-- Tagline: Ideate. Implement. Inspire. -->
  <text x="60" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.4">Ideate. Implement. Inspire.</text>
</svg>

