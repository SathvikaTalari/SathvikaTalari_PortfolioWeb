<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="vaultGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="100%" stop-color="#ee5253"/>
    </linearGradient>
    <linearGradient id="vaultGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ee5253"/>
      <stop offset="100%" stop-color="#c23616"/>
    </linearGradient>
  </defs>
  
  <rect width="120" height="120" rx="16" fill="#ffffff"/>

  <!-- Isometric Interlocking Hex Ribbon / Cube Symbol -->
  <g transform="translate(60, 44)">
    <!-- Top Loop -->
    <path d="M 0 -24 L 20 -12 L 20 -4 L 0 -16 L -20 -4 L -20 -12 Z" fill="#ff7675"/>
    <path d="M 20 -12 L 20 4 L 14 7 L 14 -8 Z" fill="#d63031"/>
    <path d="M -20 -12 L -20 4 L -14 7 L -14 -8 Z" fill="#e17055"/>
    
    <!-- Mid Crossing Strands -->
    <path d="M 0 -16 L 14 -8 L 0 0 L -14 -8 Z" fill="#fab1a0" opacity="0.6"/>
    <path d="M -20 4 L 0 16 L 0 24 L -20 12 Z" fill="url(#vaultGrad1)"/>
    <path d="M 20 4 L 0 16 L 0 24 L 20 12 Z" fill="url(#vaultGrad2)"/>

    <!-- Bottom Interlocking Loop -->
    <path d="M 0 0 L 16 10 L 0 20 L -16 10 Z" fill="#ff7675" opacity="0.9"/>
    <path d="M -16 10 L 0 20 L 0 28 L -16 18 Z" fill="#d63031"/>
    <path d="M 16 10 L 0 20 L 0 28 L 16 18 Z" fill="#e17055"/>
  </g>

  <!-- Typography: VaultofCodes -->
  <text x="60" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#d63031" text-anchor="middle" letter-spacing="0.5">VaultofCodes</text>
</svg>

