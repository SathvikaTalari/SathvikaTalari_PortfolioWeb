<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shap-pos" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="shap-neg" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- Feature Attribution Baseline -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>
  <!-- Feature 1: Positive force -->
  <rect x="32" y="12" width="22" height="7" rx="3.5" fill="url(#shap-pos)"/>
  <!-- Feature 2: Negative force -->
  <rect x="14" y="23" width="18" height="7" rx="3.5" fill="url(#shap-neg)"/>
  <!-- Feature 3: Strong Positive force -->
  <rect x="32" y="34" width="26" height="7" rx="3.5" fill="url(#shap-pos)"/>
  <!-- Feature 4: Negative force -->
  <rect x="20" y="45" width="12" height="7" rx="3.5" fill="url(#shap-neg)"/>
</svg>