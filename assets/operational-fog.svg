<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="fogBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0c162d" />
      <stop offset="100%" stop-color="#030710" />
    </linearGradient>
    <linearGradient id="tacticalAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="alertRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="tacticalGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(56, 189, 248, 0.06)" stroke-width="1" />
      <circle cx="16" cy="16" r="0.8" fill="rgba(56, 189, 248, 0.2)" />
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="800" height="480" fill="url(#fogBgGrad)" />
  <rect width="800" height="480" fill="url(#tacticalGrid)" />

  <!-- Ambient Tactical Glows -->
  <circle cx="180" cy="160" r="160" fill="rgba(245, 158, 11, 0.10)" />
  <circle cx="620" cy="300" r="170" fill="rgba(239, 68, 68, 0.09)" />
  <circle cx="400" cy="240" r="220" fill="rgba(6, 182, 212, 0.08)" />

  <!-- Main Console Window Frame -->
  <g transform="translate(50, 35)">
    <!-- Outer Window Card -->
    <rect width="700" height="410" rx="14" fill="rgba(11, 18, 33, 0.92)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1.5" />
    <!-- Header Bar -->
    <rect width="700" height="42" rx="14" fill="rgba(17, 27, 49, 0.85)" />
    <circle cx="22" cy="21" r="5.5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5.5" fill="#f59e0b" />
    <circle cx="58" cy="21" r="5.5" fill="#10b981" />

    <!-- System Status Label -->
    <text x="350" y="26" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="0.1em">
      OPERATIONAL FOG · TACTICAL DISRUPTION SIMULATION MATRIX
    </text>

    <!-- LIVE STATUS BADGE -->
    <rect x="580" y="11" width="105" height="20" rx="10" fill="rgba(239, 68, 68, 0.2)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1" />
    <circle cx="592" cy="21" r="3.5" fill="#ef4444" />
    <text x="642" y="25" font-family="monospace" font-size="9" font-weight="700" fill="#fca5a5" text-anchor="middle">BLACKOUT SIM</text>

    <!-- LEFT PANE: Tactical Map & Disruption Grid -->
    <g transform="translate(20, 56)">
      <rect width="370" height="332" rx="10" fill="#070c17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

      <!-- Tactical Radar Rings -->
      <circle cx="185" cy="150" r="120" fill="none" stroke="rgba(6, 182, 212, 0.15)" stroke-dasharray="4 4" />
      <circle cx="185" cy="150" r="80" fill="none" stroke="rgba(6, 182, 212, 0.25)" />
      <circle cx="185" cy="150" r="40" fill="none" stroke="rgba(6, 182, 212, 0.35)" />
      <line x1="185" y1="30" x2="185" y2="270" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1" />
      <line x1="65" y1="150" x2="305" y2="150" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1" />

      <!-- Radar Sweep Sector -->
      <path d="M 185 150 L 270 65 A 120 120 0 0 1 305 150 Z" fill="rgba(6, 182, 212, 0.08)" />

      <!-- Node Alpha (HQ / Lead) -->
      <circle cx="185" cy="150" r="9" fill="#10b981" />
      <circle cx="185" cy="150" r="16" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="185" y="132" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">HQ [ALPHA]</text>

      <!-- Node Bravo (Comms Relay - Jittered) -->
      <circle cx="95" cy="85" r="7" fill="#f59e0b" />
      <text x="95" y="70" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#fde68a" text-anchor="middle">RELAY [BRAVO]</text>
      <!-- Connected Path with Jitter -->
      <path d="M 185 150 L 140 120 L 95 85" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" />
      <text x="145" y="112" font-family="monospace" font-size="8" fill="#f59e0b">+3200ms</text>

      <!-- Node Charlie (Field Team - Blackout Severed) -->
      <circle cx="285" cy="95" r="7" fill="#ef4444" />
      <text x="285" y="80" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#fca5a5" text-anchor="middle">RECON [CHARLIE]</text>
      <!-- Severed Line with Cross -->
      <path d="M 185 150 L 230 125" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" />
      <line x1="230" y1="118" x2="242" y2="130" stroke="#ef4444" stroke-width="2.5" />
      <line x1="242" y1="118" x2="230" y2="130" stroke="#ef4444" stroke-width="2.5" />
      <text x="250" y="125" font-family="monospace" font-size="8" fill="#ef4444">DROPPED</text>

      <!-- Node Delta (Logistics - Active) -->
      <circle cx="250" cy="225" r="7" fill="#38bdf8" />
      <text x="250" y="245" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#bae6fd" text-anchor="middle">LOGISTICS [DELTA]</text>
      <path d="M 185 150 L 250 225" fill="none" stroke="#38bdf8" stroke-width="2" />

      <!-- Tactical Disruption HUD Banner -->
      <g transform="translate(15, 275)">
        <rect width="340" height="44" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1" />
        <text x="12" y="18" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#94a3b8">SIMULATION MODE: CRISIS PROTOCOL DELTA</text>
        <text x="12" y="34" font-family="monospace" font-size="8.5" fill="#f59e0b">SIGNAL DEGRADATION: 48% · PACKET LOSS: HIGH</text>
        <rect x="245" y="12" width="82" height="20" rx="4" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1" />
        <text x="286" y="25" font-family="monospace" font-size="8.5" font-weight="700" fill="#fde68a" text-anchor="middle">REPLAY 07:42</text>
      </g>
    </g>

    <!-- RIGHT PANE: Metrics, Decision Tracking, After-Action Review -->
    <g transform="translate(406, 56)">
      <!-- Card 1: Team Coordination & Resilience Score -->
      <rect width="274" height="102" rx="10" fill="#070c17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <text x="14" y="22" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">OPERATIONAL RESILIENCE INDEX</text>

      <!-- Circular Gauge -->
      <circle cx="50" cy="64" r="28" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="6" />
      <circle cx="50" cy="64" r="28" fill="none" stroke="#f59e0b" stroke-width="6" stroke-dasharray="176" stroke-dashoffset="38" stroke-linecap="round" transform="rotate(-90 50 64)" />
      <text x="50" y="68" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">78%</text>

      <!-- Metrics -->
      <g transform="translate(95, 38)">
        <text x="0" y="12" font-family="monospace" font-size="8.5" fill="#64748b">DECISION LATENCY</text>
        <text x="0" y="26" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1.8s avg</text>

        <text x="95" y="12" font-family="monospace" font-size="8.5" fill="#64748b">INFO ACCURACY</text>
        <text x="95" y="26" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#10b981">92.4%</text>

        <text x="0" y="44" font-family="monospace" font-size="8" fill="#fca5a5">⚠️ 3 Dropped Field Intel Reports</text>
      </g>

      <!-- Card 2: Live Decision Tracking Log -->
      <g transform="translate(0, 114)">
        <rect width="274" height="126" rx="10" fill="#070c17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="14" y="20" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">REAL-TIME MULTIPLAYER FEED</text>

        <!-- Log items -->
        <g transform="translate(14, 32)">
          <!-- Item 1 -->
          <circle cx="4" cy="6" r="3" fill="#10b981" />
          <text x="14" y="9" font-family="monospace" font-size="8" fill="#a7f3d0">07:15 [HQ] Reroute Bravo unit via Grid 4</text>

          <!-- Item 2 -->
          <circle cx="4" cy="26" r="3" fill="#ef4444" />
          <text x="14" y="29" font-family="monospace" font-size="8" fill="#fca5a5">07:28 [JAMMING] Comm burst rejected</text>

          <!-- Item 3 -->
          <circle cx="4" cy="46" r="3" fill="#f59e0b" />
          <text x="14" y="49" font-family="monospace" font-size="8" fill="#fde68a">07:34 [CONCURRENCY] BroadcastChannel sync</text>

          <!-- Item 4 -->
          <circle cx="4" cy="66" r="3" fill="#38bdf8" />
          <text x="14" y="69" font-family="monospace" font-size="8" fill="#bae6fd">07:42 [DELTA] Supplies dispatched</text>
        </g>
      </g>

      <!-- Card 3: Automated AAR Report Generated -->
      <g transform="translate(0, 252)">
        <rect width="274" height="80" rx="10" fill="rgba(245, 158, 11, 0.06)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
        <text x="14" y="22" font-family="'Space Grotesk', sans-serif" font-size="10.5" font-weight="700" fill="#fbbf24">AUTOMATED AFTER-ACTION REVIEW</text>
        <text x="14" y="40" font-family="monospace" font-size="8.5" fill="#94a3b8">Comprehensive PDF report compiled.</text>

        <!-- Download Badge -->
        <rect x="14" y="50" width="130" height="20" rx="5" fill="#f59e0b" />
        <text x="79" y="64" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#070c18" text-anchor="middle">📄 DOWNLOAD AAR PDF</text>

        <!-- Tech Badges -->
        <text x="155" y="64" font-family="monospace" font-size="8" fill="#94a3b8">React 19 · Docker</text>
      </g>
    </g>
  </g>
</svg>
